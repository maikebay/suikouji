openapi: 3.0.3
info:
  title: 随口记 Agent API
  version: agent-1
  description: |
    面向受认证 Agent 的个人记账与个人事业接口。workspace_id 必须属于服务端
    principal 的 owner；调用方不能指定 owner。先读取 capabilities，信息不足
    或能力不支持时主动追问。标准成本不等于实际成本或实际利润。
    写入 request_id 限定于 principal/workspace/operation，同号不同内容返回 409。
    业务与完整响应一起提交；重放保留原业务结果，顶层 duplicate 改为 true。
    修正响应保留 review 包装，其 duplicate 同步顶层标记；record、changed、history 保留原结果。
    X-Request-ID 是服务端生成的追踪编号，与业务 request_id 分离。
    旧版本孤立请求若已有业务结果而无完整响应，返回 409 recovery_needs_review 供人工核对。
    已完成请求仍校验 owner/workspace；后续 profile 变更或修正目标删除不阻止重放。
    JSON 请求体上限 32768 字节；CSV 本身最多 2000000 UTF-8 字节，HTTP 仍受请求体上限约束。
    0.2.0-staging 使用 schema v6，新增独立生意随想；随想不计入财务汇总、不产生任务或提醒。
    structured 的四个旧数组仍必填，thoughts 可省略；新结构化解析版本为 agent-structured-2。
    新回执包含 thoughts，历史完整缓存原样重放，可能没有该字段；客户端须兼容缺省。
servers:
  - url: http://127.0.0.1:8765
security:
  - bearerAuth: []
paths:
  /v1/capabilities:
    get:
      operationId: getCapabilities
      responses:
        '200': {description: Product capability and clarification contract}
        default: {$ref: '#/components/responses/Error'}
  /v1/workspaces:
    get:
      operationId: listWorkspaces
      responses:
        '200': {description: Workspaces visible to the configured principal and allowlist}
        default: {$ref: '#/components/responses/Error'}
  /v1/captures:
    post:
      operationId: captureText
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CaptureRequest'}
      responses:
        '200':
          description: >-
            Terminal capture including parsed, partial, unparsed, rejected or needs_confirmation
            and its projections. HTTP 200 does not imply a financial write: inspect entries/sales
            and parsed.leftovers. A partial capture may contain successfully booked financial rows.
            Preserve the original text; do not rewrite and resubmit to force parsing.
            Newly executed receipts include thoughts; structured receipts also include
            normalization.thoughts. Historical cached receipts may omit both and replay unchanged.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CaptureResponse'}
        '400':
          description: invalid_structured for any invalid structured row; no partial write or parser fallback
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409':
          description: idempotency_conflict or request_in_progress; retry in-progress with the same business request_id
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        default: {$ref: '#/components/responses/Error'}
  /v1/captures/{capture_id}:
    get:
      operationId: getCapture
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {$ref: '#/components/parameters/CaptureId'}
      responses:
        '200':
          description: Original record and same-workspace projections, including complete thoughts and tags
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CaptureDetail'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /v1/thoughts:
    get:
      operationId: listThoughts
      description: |
        返回当前工作空间的独立随想，不夹带账目；按 date DESC, created_at DESC, id DESC 排序。
        start/end 过滤随想记录日（闭区间）。重复 tag 采用 AND，规范化去重，不拆逗号。
        q 对 title/body 作 Unicode casefold 后的字面子串匹配，不搜索标签、不执行正则或 SQL。
        before 必须复用服务端返回的不透明游标；绑定 workspace 及规范化后的日期、标签和 q。
        标签顺序或重复、q 大小写不改变筛选语义；翻页可改变 page_size。
        非 tag 参数不能重复，未知参数拒绝。显式空 start/end/tag/before 拒绝，空 q 表示不限制。
        空结果返回 200、items=[]、has_more=false、next_before=null。
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {$ref: '#/components/parameters/ThoughtStart'}
        - {$ref: '#/components/parameters/ThoughtEnd'}
        - {$ref: '#/components/parameters/ThoughtTag'}
        - {$ref: '#/components/parameters/ThoughtQuery'}
        - {$ref: '#/components/parameters/ThoughtPageSize'}
        - {$ref: '#/components/parameters/ThoughtBefore'}
      responses:
        '200':
          description: 随想分页结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ThoughtPage'}
        '400':
          description: 'workspace_required（缺工作空间）、invalid_range（日期或范围）、invalid_tags（标签）、invalid_query（关键词、重复或未知参数）、invalid_page_size（页大小）、invalid_cursor（游标无效或筛选/工作空间不匹配）'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /v1/timeline:
    get:
      operationId: listTimeline
      description: |
        一条原话一个条目，继续按 capture 事件时间分页；start/end 不是 thought.date 的筛选。
        types 只可省略或为单值 thought；后者只选含随想的原话，混合条目仍保留账目预览。
        q 搜索原有原话/投影以及随想标题、正文和标签。随想预览最多3条，正文最多120字符。
        有原有领域行时保留原财务/观测事件日期算法；纯随想取随想记录日期最大值。
        正文中的明天、下周等不会把原话事件时间前移。既有 before 游标继续使用。
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {name: q, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/Start'}
        - {$ref: '#/components/parameters/End'}
        - {name: parse_status, in: query, schema: {type: string}}
        - {name: source, in: query, schema: {type: string}}
        - {name: types, in: query, description: '仅支持省略或单值 thought；空值、重复、多值及其他类型返回 invalid_types', schema: {type: string, enum: [thought]}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 30}}
        - {name: before, in: query, description: '沿用上一页 next_before 三元组组成的 occurred_at|created_at|id 游标；空值、重复、缺段、多段或日期/时间无效返回 invalid_cursor；不同于随想列表的不透明游标', schema: {type: string}}
      responses:
        '200':
          description: 原话时间线分页结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TimelinePage'}
        '400':
          description: invalid_types, invalid_page_size or invalid_cursor
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        default: {$ref: '#/components/responses/Error'}
  /v1/summary:
    get:
      operationId: getSummary
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {name: month, in: query, schema: {type: string, pattern: '^[0-9]{4}-[0-9]{2}$'}}
      responses:
        '200': {description: Financial summary based on ledger entries}
        default: {$ref: '#/components/responses/Error'}
  /v1/entries:
    get:
      operationId: listEntries
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {$ref: '#/components/parameters/Start'}
        - {$ref: '#/components/parameters/End'}
        - {name: type, in: query, schema: {type: string}}
      responses:
        '200': {description: Entries}
        default: {$ref: '#/components/responses/Error'}
  /v1/sales:
    get:
      operationId: listSales
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {$ref: '#/components/parameters/Start'}
        - {$ref: '#/components/parameters/End'}
      responses:
        '200': {description: Sales detail; not added again to ledger totals}
        default: {$ref: '#/components/responses/Error'}
  /v1/observations:
    get:
      operationId: listObservations
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {$ref: '#/components/parameters/Start'}
        - {$ref: '#/components/parameters/End'}
        - {name: kind, in: query, schema: {type: string}}
        - {name: subject, in: query, schema: {type: string}}
        - {name: measure, in: query, schema: {type: string}}
      responses:
        '200': {description: Derived operational observations; not financial authority}
        default: {$ref: '#/components/responses/Error'}
  /v1/reviews:
    get:
      operationId: listReviews
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}]
      responses:
        '200': {description: Review items}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: applyReview
      description: Call only after the user has confirmed the fields and correction reason.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewRequest'}
      responses:
        '200':
          description: Correction result; duplicate is exposed at both levels for compatibility
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /v1/imports/preview:
    post:
      operationId: previewImport
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportPreviewRequest'}
      responses:
        '200':
          description: Exact plan to display for confirmation; token valid for 1800 seconds
          content:
            application/json:
              schema:
                type: object
                required: [preview, sha256, preview_token, workspace_id, confirmation_required, expires_in_seconds, duplicate_file, existing_batch]
                properties:
                  preview: {type: object}
                  sha256: {type: string}
                  preview_token: {type: string}
                  workspace_id: {type: string}
                  confirmation_required: {type: boolean, enum: [true]}
                  expires_in_seconds: {type: integer, enum: [1800]}
                  duplicate_file: {type: boolean, description: Whether this exact file already has an import batch}
                  existing_batch:
                    type: object
                    nullable: true
                    required: [id, filename, rows]
                    properties:
                      id: {type: string}
                      filename: {type: string}
                      rows: {type: integer, minimum: 0}
        default: {$ref: '#/components/responses/Error'}
  /v1/imports/xlsx-preview:
    post:
      operationId: previewXlsx
      description: |
        Multipart upload for one .xlsx file. The file is at most 10MiB and non-file
        form fields are at most 64KiB. Measured uncompressed content is at most 50MiB
        across at most 1000 members. Macros, formulas, and external links are not executed.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [workspace_id, file]
              properties:
                workspace_id: {type: string, minLength: 1}
                file: {type: string, format: binary}
                sheet_index: {type: integer, minimum: 0, default: 0}
                header_row: {type: integer, minimum: 0, default: 0}
      responses:
        '200': {description: Preview bound to the staged file and one visible worksheet}
        default: {$ref: '#/components/responses/Error'}
  /v1/imports/xlsx-commit:
    post:
      operationId: commitXlsx
      description: |
        Confirm a previously previewed XLSX worksheet. The body contains no file bytes.
        The preview token expires after 1800 seconds and is consumed by one request_id.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/XlsxCommitRequest'}
      responses:
        '200': {description: Original import result or cached replay}
        '409': {description: confirmation_required, preview_mismatch, source_missing, config_version_conflict or idempotency_conflict}
        default: {$ref: '#/components/responses/Error'}
  /v1/imports/commit:
    post:
      operationId: commitImport
      description: |
        Submit the exact CSV and token after user confirmation. Token is scoped to
        principal/workspace/CSV, expires after 1800 seconds, and is consumed atomically
        by one request_id. Identical successful request replay still works after token
        expiry. Nested result.imported keeps the original count on request replay.
        A batch appearing after preview without this request's complete response returns
        recovery_needs_review. Review it and obtain a new preview; a preview already showing
        that batch can be confirmed as an intentional duplicate without adding ledger rows.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportCommitRequest'}
      responses:
        '200': {description: Original import result or cached replay}
        '409':
          description: 'confirmation_required, preview_required, preview_mismatch, preview_expired, preview_consumed, import_needs_review, import_conflict, recovery_needs_review, idempotency_conflict or request_in_progress'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        default: {$ref: '#/components/responses/Error'}
  /healthz:
    get:
      security: []
      responses:
        '200': {description: Process is alive; no database opened}
  /readyz:
    get:
      security: []
      responses:
        '200': {description: Read-only database check and configured worker readiness passed}
        '503': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Authentication scheme is case-insensitive; the ASCII token must match exactly.
  responses:
    Error:
      description: |
        Structured error. 400 invalid input; 401 missing/invalid Bearer; 403 denied scope;
        404 absent route/capture; 405 unsupported method (Allow header); 409 conflict/in-progress;
        413 request body too large; 415 non-JSON media; 500 failed operation;
        503 missing authentication configuration or database/worker not ready.
      headers:
        X-Request-ID:
          description: Server-generated trace ID, also present at both locations in the error body
          schema: {type: string}
        Allow:
          description: Present on 405; lists only the methods supported by the requested route
          schema: {type: string, enum: [GET, POST, 'GET, POST']}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  parameters:
    WorkspaceId:
      name: workspace_id
      in: query
      required: true
      schema: {type: string, minLength: 1}
    CaptureId:
      name: capture_id
      in: path
      required: true
      schema: {type: string}
    Start:
      name: start
      in: query
      schema: {type: string}
    End:
      name: end
      in: query
      schema: {type: string}
    ThoughtStart:
      name: start
      in: query
      description: 随想记录日闭区间起点，严格有效公历 YYYY-MM-DD；不得晚于 end
      schema: {$ref: '#/components/schemas/ThoughtDate'}
    ThoughtEnd:
      name: end
      in: query
      description: 随想记录日闭区间终点，严格有效公历 YYYY-MM-DD
      schema: {$ref: '#/components/schemas/ThoughtDate'}
    ThoughtTag:
      name: tag
      in: query
      style: form
      explode: true
      description: '重复参数如 tag=新品&tag=南瓜，AND；先检查最多20项，再按规范化精确值去重；不按逗号拆分'
      schema:
        type: array
        maxItems: 20
        items: {$ref: '#/components/schemas/ThoughtTagInput'}
    ThoughtQuery:
      name: q
      in: query
      description: 标题/正文按 Unicode casefold 后字面子串匹配；空串不限制；不裁去关键词空白
      schema: {type: string, maxLength: 200, default: ''}
    ThoughtPageSize:
      name: page_size
      in: query
      description: 十进制整数，拒绝小数、布尔值或超范围；翻页可变更
      schema: {type: integer, minimum: 1, maximum: 100, default: 30}
    ThoughtBefore:
      name: before
      in: query
      description: 上页 next_before；不透明，绑定工作空间和规范化后的 start/end/tag/q，不绑定 page_size
      schema: {type: string, minLength: 1, maxLength: 2048}
  schemas:
    ErrorEnvelope:
      type: object
      required: [error, request_id]
      properties:
        request_id: {type: string, description: Server trace ID matching X-Request-ID}
        error:
          type: object
          required: [code, message, details, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: object}
            request_id: {type: string, description: Same server trace ID; retained for compatibility}
    CaptureRequest:
      type: object
      required: [workspace_id, text, request_id]
      properties:
        workspace_id: {type: string, minLength: 1}
        text: {type: string, minLength: 1, maxLength: 2000}
        request_id: {type: string, minLength: 1, maxLength: 100}
        source: {type: string, enum: [agent, chat, ilink, web, cli]}
        received_at: {type: string, maxLength: 80, description: 'ISO date/time beginning YYYY-MM-DD'}
        context: {type: string}
        intent: {type: string}
        profile_id: {type: string, description: Must match the workspace profile}
        structured:
          $ref: '#/components/schemas/AgentStructuredCapture'
      description: >-
        Preferred Agent flow: preserve text verbatim and supply structured data after
        interpreting messy speech. Missing structured retains the legacy rule parser.
        Explicit null or malformed structured is rejected and never falls back to parsing.
        Normalized projections and original text commit once in the same transaction.
    AgentStructuredCapture:
      type: object
      additionalProperties: false
      required: [entries, sales, observations, leftovers]
      description: >-
        Restaurant profile only, including thought-only captures. The four legacy arrays
        entries/sales/observations/leftovers remain required. Optional thoughts defaults to []
        only in a validation copy after fingerprinting; explicit null is invalid.
        At most 50 domain rows across entries/sales/observations/thoughts combined,
        and at most 50 leftovers. At least one domain row or leftover is required.
        Entries/sales/observations require actual facts; thoughts preserve ideas and opinions
        without assertion, financial amount or task fields. Every source_quote and leftover
        must occur verbatim in original text. Evidence presence does not prove interpretation.
        Any invalid row rejects the entire request. Raw request differences, including omitted
        thoughts versus explicit [], conflict under the same request_id; normalization never
        changes the idempotency fingerprint.
      properties:
        entries:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/AgentEntry'}
        sales:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/AgentSale'}
        observations:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/AgentObservation'}
        thoughts:
          type: array
          maxItems: 50
          description: 可省略；仅验证副本补空数组，客户端重试不得补字段或改变首次请求
          items: {$ref: '#/components/schemas/ThoughtInput'}
        leftovers:
          type: array
          maxItems: 50
          items: {type: string, minLength: 1, maxLength: 2000}
    ThoughtDate:
      type: string
      format: date
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      description: 严格有效公历日期 YYYY-MM-DD；非法日期不替换为今天
    ThoughtTagInput:
      type: string
      description: |
        Unicode NFC 后去首尾空白，去至多一个开头 # 后再去首尾空白。
        规范化后1至32个Unicode字符；保留大小写；拒绝内部空白、控制字符和剩余 #。
        标签数组先检查20项上限，再按规范化精确值去重并保留首次顺序。
    ThoughtTag:
      type: string
      minLength: 1
      maxLength: 32
      description: 规范化后的标签，不带 #，大小写不同视为不同值
    ThoughtInput:
      type: object
      additionalProperties: false
      required: [date, body, source_quote]
      description: |
        独立随想校验；不接受 null、id、workspace_id、capture_id、金额、assertion、plan/任务/提醒字段。
        字符上限按 Unicode 字符数。date 是归档日，默认收到原话在工作空间时区中的日期；
        正文中的昨天/明天/下周不改归档日，只有明确归档指令经 Agent 整理才采用指定日期。
        body 可整理但须保留原意和不确定语气；Markdown 只作为内容，不执行HTML、链接或指令。
        source_quote 必须是原话中精确、连续、非空片段。
        文本须能以 UTF-8 编码；title/body/source_quote 不接受 U+0000，非法字符返回 invalid_structured，不替换或删去。
      properties:
        date: {$ref: '#/components/schemas/ThoughtDate'}
        title: {type: string, minLength: 1, maxLength: 80, description: 可省略；提供时非空白文本，不生成假标题}
        body: {type: string, minLength: 1, maxLength: 2000, description: 非空白 Markdown 正文}
        tags:
          type: array
          maxItems: 20
          description: 可省略，验证后为 []；没标签不追问；显式 null 拒绝
          items: {$ref: '#/components/schemas/ThoughtTagInput'}
        source_quote: {type: string, minLength: 1, maxLength: 2000}
    Thought:
      type: object
      required: [id, workspace_id, capture_id, date, body, tags, source_quote, created_at, updated_at]
      description: 服务端生成身份与归属的公开随想；没有独立创建、编辑或删除接口
      properties:
        id: {type: string}
        workspace_id: {type: string}
        capture_id: {type: string}
        date: {$ref: '#/components/schemas/ThoughtDate'}
        title: {type: string, minLength: 1, maxLength: 80, description: 未提供标题时省略字段，不返回 null；显示摘要不改正文}
        body: {type: string, minLength: 1, maxLength: 2000}
        tags:
          type: array
          maxItems: 20
          uniqueItems: true
          items: {$ref: '#/components/schemas/ThoughtTag'}
        source_quote: {type: string, minLength: 1, maxLength: 2000}
        created_at: {type: string, description: 服务端生成的 ISO 日期时间字符串，沿用现有时间戳格式}
        updated_at: {type: string, description: 首版创建时与 created_at 相同}
    ThoughtPage:
      type: object
      required: [items, has_more, next_before]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Thought'}
        has_more: {type: boolean}
        next_before: {type: string, nullable: true, description: 有后续页时的不透明游标，末页为 null}
    CaptureResponse:
      type: object
      required: [duplicate, status, capture, parsed, entries, sales, observations, warnings, provenance]
      description: |
        新执行回执必有顶层 thoughts；structured 模式必有 normalization.thoughts。
        为兼容历史完整缓存，schema 不将这两个新增字段设为所有响应必填；历史缓存原样重放。
        只有随想不等于财务入账；有未解析片段为 partial，无未解析片段且有投影为 parsed。
        原话、所有投影/标签、请求认领和完整响应同事务提交或回滚。
      properties:
        duplicate: {type: boolean}
        status: {type: string, enum: [parsed, partial, unparsed, rejected, needs_confirmation]}
        capture: {type: object, description: 完整原话及解析元数据}
        parsed: {type: object, nullable: true, description: 解析结果；leftovers 为未解析原文片段}
        entries: {type: array, items: {type: object}}
        sales: {type: array, items: {type: object}}
        observations: {type: array, items: {type: object}}
        thoughts:
          type: array
          items: {$ref: '#/components/schemas/Thought'}
        normalization:
          allOf:
            - {$ref: '#/components/schemas/AgentStructuredCapture'}
          description: 经校验的结构化结果，新执行结果含 thoughts；解析版本 agent-structured-2；历史缓存可能缺省
        warnings: {type: array, items: {type: string}}
        provenance: {type: object}
    CaptureDetail:
      type: object
      required: [record, entries, sales, observations, thoughts, warnings]
      properties:
        record: {type: object, description: 完整原话及解析元数据}
        entries: {type: array, items: {type: object}}
        sales: {type: array, items: {type: object}}
        observations: {type: array, items: {type: object}}
        thoughts:
          type: array
          items: {$ref: '#/components/schemas/Thought'}
        warnings: {type: array, items: {type: string}}
    ThoughtPreview:
      type: object
      required: [id, date, body, tags]
      properties:
        id: {type: string}
        date: {$ref: '#/components/schemas/ThoughtDate'}
        title: {type: string, minLength: 1, maxLength: 80, description: 未提供标题时省略字段}
        body: {type: string, maxLength: 120, description: 正文摘要；完整正文通过原话详情或随想列表获取}
        tags:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/ThoughtTag'}
    TimelineItem:
      type: object
      required: [record, event_time, projection_counts, ledger_preview, thought_preview, warnings]
      properties:
        record: {type: object}
        event_time: {type: string}
        projection_counts:
          type: object
          required: [entries, sales, observations, thoughts]
          properties:
            entries: {type: integer, minimum: 0}
            sales: {type: integer, minimum: 0}
            observations: {type: integer, minimum: 0}
            thoughts: {type: integer, minimum: 0, description: 随想总条数，不能以预览条数代替}
        correction_count: {type: integer, minimum: 0}
        ledger_preview: {type: array, items: {type: object}, description: 混合原话继续保留既有账目预览}
        thought_preview:
          type: array
          maxItems: 3
          items: {$ref: '#/components/schemas/ThoughtPreview'}
        warnings: {type: array, items: {type: string}}
    TimelinePage:
      type: object
      required: [items, has_more, next_before]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TimelineItem'}
        has_more: {type: boolean}
        next_before:
          type: array
          nullable: true
          minItems: 3
          maxItems: 3
          items: {type: string}
          description: 沿用事件时间、创建时间、原话ID三元组；下一请求用 | 连接，末页为 null
    AgentEntry:
      type: object
      additionalProperties: false
      required: [date, type, category, amount, amount_basis, granularity, source_quote, assertion]
      properties:
        date: {type: string, format: date, description: Canonical YYYY-MM-DD; never default an invalid date to today}
        type: {type: string, enum: [revenue, purchase, expense]}
        category:
          type: string
          description: Revenue is 营业额; purchase is 食材成本; expense uses current controlled categories
          enum: [营业额, 食材成本, 房租, 人工, 水电, 平台佣金, 包装耗材, 推广, 维修, 税费, 其他支出]
        amount: {type: number, minimum: 0, maximum: 1000000000000}
        amount_basis: {type: string, enum: [gross, settlement]}
        granularity: {type: string, enum: [daily, transaction]}
        source_quote: {type: string, minLength: 1, maxLength: 2000, description: Exact contiguous substring of original text}
        assertion: {type: string, enum: [actual]}
        item: {type: string, maxLength: 100}
        qty: {type: number, minimum: 0, maximum: 1000000000000, description: Purchase only; paired with unit when present}
        unit: {type: string, maxLength: 100}
        period_month: {type: string, pattern: '^\d{4}-\d{2}$', description: Expense attribution month when explicitly known}
        platform: {type: string, maxLength: 100}
        channel: {type: string, maxLength: 100}
    AgentSale:
      type: object
      additionalProperties: false
      required: [date, product_name, qty, amount, unit, amount_basis, granularity, source_quote, assertion]
      properties:
        date: {type: string, format: date}
        product_name: {type: string, minLength: 1, maxLength: 100, description: No leading or trailing whitespace}
        qty: {type: number, minimum: 0, maximum: 1000000000000}
        amount: {type: number, nullable: true, minimum: 0, maximum: 1000000000000, description: Null means unknown; never invent an amount}
        unit: {type: string, minLength: 1, maxLength: 100}
        amount_basis: {type: string, enum: [gross, settlement]}
        granularity: {type: string, enum: [daily, transaction]}
        source_quote: {type: string, minLength: 1, maxLength: 2000}
        assertion: {type: string, enum: [actual]}
        platform: {type: string, maxLength: 100}
        channel: {type: string, maxLength: 100}
        product_category: {type: string, maxLength: 100}
    AgentObservation:
      type: object
      additionalProperties: false
      required: [date, kind, measure, source_quote, assertion]
      description: >-
        Only existing nonfinancial observations: 客流人数/桌数; 订单单量;
        天气天气; 排班出勤; 评价评分/差评数. Exactly one non-null value_num or
        value_text; numeric facts use the corresponding count/rating unit.
        Financial amounts and sales must use entries/sales, never observations.
      properties:
        date: {type: string, format: date}
        kind: {type: string, enum: [客流, 订单, 天气, 排班, 评价]}
        measure: {type: string, enum: [人数, 桌数, 单量, 天气, 出勤, 评分, 差评数]}
        value_num: {type: number, minimum: 0, maximum: 1000000000000}
        value_text: {type: string, minLength: 1, maxLength: 100}
        unit: {type: string, maxLength: 100}
        subject: {type: string, maxLength: 100}
        source_quote: {type: string, minLength: 1, maxLength: 2000}
        assertion: {type: string, enum: [actual]}
    ReviewResponse:
      type: object
      required: [review, duplicate]
      properties:
        duplicate:
          type: boolean
          description: False on first success, true on identical successful request replay; matches review.duplicate
        review: {$ref: '#/components/schemas/ReviewResult'}
    ReviewResult:
      type: object
      required: [duplicate, record, target_id, changed]
      properties:
        duplicate:
          type: boolean
          description: Compatibility replay flag, matching the top-level duplicate
        record:
          type: object
          description: Original correction capture, preserved on request replay
        target_id: {type: string, description: 'entry:<id> or sale:<id>'}
        changed:
          type: object
          description: Original changed fields and written values, preserved on request replay
        history:
          type: array
          description: Original correction history when present, preserved on request replay
          items: {type: object}
    ReviewRequest:
      type: object
      required: [workspace_id, request_id, target_id, fields, reason]
      properties:
        workspace_id: {type: string, minLength: 1}
        request_id: {type: string, minLength: 1, maxLength: 100}
        target_id: {type: string, description: 'entry:<id> or sale:<id>'}
        fields: {type: object}
        reason: {type: string, minLength: 1, maxLength: 500}
    ImportPreviewRequest:
      type: object
      required: [workspace_id, csv]
      properties:
        workspace_id: {type: string, minLength: 1}
        csv: {type: string, minLength: 1, description: UTF-8 CSV; HTTP body limit is 32768 bytes including JSON encoding}
    ImportCommitRequest:
      allOf:
        - {$ref: '#/components/schemas/ImportPreviewRequest'}
        - type: object
          required: [request_id, confirmed, preview_token]
          properties:
            request_id: {type: string, minLength: 1, maxLength: 100}
            confirmed: {type: boolean, enum: [true]}
            preview_token: {type: string, minLength: 1}
            filename: {type: string, minLength: 1, maxLength: 200}
    XlsxCommitRequest:
      type: object
      required: [workspace_id, request_id, confirmed, preview_token]
      properties:
        workspace_id: {type: string, minLength: 1}
        request_id: {type: string, minLength: 1, maxLength: 100}
        confirmed: {type: boolean, enum: [true]}
        preview_token: {type: string, minLength: 1}
        filename: {type: string, minLength: 1, maxLength: 200}
